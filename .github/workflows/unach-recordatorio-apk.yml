name: unach-recordatorio-apk

on:
  push:
    paths:
      - "unach-recordatorio/**"
      - ".github/workflows/unach-recordatorio-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unach-recordatorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: recordatorio-unach-apk
          path: unach-recordatorio/app/build/outputs/apk/debug/app-debug.apk
